buildscript {
    ext {
        springBootVersion = '1.5.22.RELEASE'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'spring-boot'

group = 'tv.videoready'
version = '0.0.1-SNAPSHOT'
description = 'Internal engineering documentation hub (partner onboarding / deboarding flows)'
sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    compile("org.springframework.boot:spring-boot-starter-web:${springBootVersion}")
    compile("org.springframework.boot:spring-boot-starter-thymeleaf:${springBootVersion}")
    compile 'org.commonmark:commonmark:0.17.2'
    compile 'org.commonmark:commonmark-ext-gfm-tables:0.17.2'
}

sourceSets {
    main {
        resources {
            srcDir "$buildDir/generated-resources"
        }
    }
}

task copyRootDocs(type: Copy) {
    description = 'Copies ../docs/*.md into the classpath as documentation/'
    from "$projectDir/../docs"
    include '*.md'
    into "$buildDir/generated-resources/documentation"
}

processResources.dependsOn copyRootDocs

clean {
    delete "$buildDir/generated-resources"
}

bootRun {
    systemProperty 'file.encoding', 'UTF-8'
}

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="commonHead">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle}">Tata Play — engineering docs</title>
    <style>
        :root { --bg: #0f1419; --panel: #1a2332; --text: #e6edf3; --muted: #8b949e; --link: #58a6ff; --border: #30363d; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.55; }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }
        header { border-bottom: 1px solid var(--border); background: var(--panel); padding: 0.75rem 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
        header strong { font-size: 1.05rem; }
        nav { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; align-items: center; }
        nav a { font-size: 0.9rem; }
        nav a.active { font-weight: 600; text-decoration: underline; }
        main { max-width: 58rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
        .callout { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.9rem; color: var(--muted); }
        .markdown-body { font-size: 0.95rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.4rem; margin-bottom: 0.5rem; font-weight: 600; line-height: 1.25; }
        .markdown-body h1 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
        .markdown-body h2 { font-size: 1.25rem; }
        .markdown-body p { margin: 0.65rem 0; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.35rem; }
        .markdown-body li { margin: 0.25rem 0; }
        .markdown-body code { background: #21262d; padding: 0.12rem 0.35rem; border-radius: 4px; font-size: 0.88em; }
        .markdown-body pre { background: #161b22; border: 1px solid var(--border); border-radius: 6px; padding: 0.85rem; overflow-x: auto; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.88rem; }
        .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 0.45rem 0.55rem; text-align: left; }
        .markdown-body th { background: var(--panel); }
        .markdown-body blockquote { margin: 0.75rem 0; padding-left: 0.9rem; border-left: 3px solid var(--border); color: var(--muted); }
        hr { border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0; }
        .flow-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); }
        .flow-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
        .flow-card h2 { margin: 0 0 0.35rem; font-size: 1.05rem; }
        .flow-card p { margin: 0; font-size: 0.88rem; color: var(--muted); }
        .muted { color: var(--muted); font-size: 0.9rem; }
    </style>
</head>
<body>
<header th:fragment="siteHeader">
    <strong>Tata Play — engineering docs hub</strong>
    <nav>
        <a th:href="@{/}" th:classappend="${navHomeActive} ? 'active'">Home</a>
        <a th:href="@{/flows/engineering-flows}" th:classappend="${navFlowsActive} ? 'active'">Flows</a>
        <a th:href="@{/flows/engineering-apis}" th:classappend="${navApisActive} ? 'active'">APIs</a>
    </nav>
</header>
</body>
</html>
